name: Wake Streamlit app

on:
  schedule:
    # Every 6 hours, at minute 17 (off the hour to avoid GitHub's busy slots).
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit the app and wake it if asleep
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: python scripts/wake_streamlit.py
