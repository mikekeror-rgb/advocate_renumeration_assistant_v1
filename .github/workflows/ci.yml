name: CI

on:
  push:
    branches: [main, self-hosted-backend]
  pull_request:

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (syntax errors and undefined names only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Unit tests
        run: pytest -q

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files (app and GPU profile)
        run: |
          cp .env.example .env
          docker compose config > /dev/null
          docker compose --profile gpu config > /dev/null
      - name: Build the app image
        run: docker build -t advocate-assistant:ci .
      - name: Smoke test (container starts and reports healthy)
        run: |
          docker run -d --name app -p 8501:8501 -e GROQ_API_KEY=dummy advocate-assistant:ci
          for i in $(seq 1 36); do
            if curl -fs http://localhost:8501/_stcore/health; then echo " -> healthy"; exit 0; fi
            sleep 5
          done
          docker logs app
          exit 1
      - name: Report image size
        run: docker images advocate-assistant:ci
